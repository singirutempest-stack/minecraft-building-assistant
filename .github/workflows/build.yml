name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        run: ./gradlew build gametestClasses --stacktrace

      - name: Inspect mod JAR
        run: |
          ls -l build/libs
          for jar in build/libs/*.jar; do
            unzip -l "$jar"
            unzip -p "$jar" META-INF/mods.toml
          done

      - name: GameTests (headless server)
        run: ./gradlew runGameTestServer --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: building-assistant-jar
          path: build/libs/*.jar
          if-no-files-found: error
