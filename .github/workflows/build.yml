name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        run: ./gradlew build gametestClasses --stacktrace

      - name: Inspect mod JAR
        run: |
          ls -l build/libs
          for jar in build/libs/*.jar; do
            unzip -l "$jar"
            unzip -p "$jar" META-INF/mods.toml
          done

      - name: GameTests (headless server)
        run: ./gradlew runGameTestServer --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: building-assistant-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Keeps the latest JAR on a separate branch so it can be fetched with plain git.
      - name: Publish JAR to builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir "$RUNNER_TEMP/builds"
          cp build/libs/*.jar "$RUNNER_TEMP/builds/"
          cd "$RUNNER_TEMP/builds"
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
